name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Read version
        shell: pwsh
        run: |
          [xml]$project = Get-Content src/NSEdge.App/NSEdge.App.csproj -Raw
          $version = [string]$project.Project.PropertyGroup.Version
          if ($version -notmatch '^\d+\.\d+$') { throw "Invalid version: $version" }
          "NSEDGE_VERSION=$version" >> $env:GITHUB_ENV

      - name: Build
        run: dotnet build NSEdge.slnx --configuration Release

      - name: Protocol tests
        run: dotnet run --project tests/NSEdge.Tests --configuration Release --no-build

      - name: Publish Windows app
        run: dotnet publish src/NSEdge.App/NSEdge.App.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true --output artifacts/package/NSEdge

      - name: WPF startup test
        shell: pwsh
        env:
          NSEDGE_PREVIEW_PATH: artifacts/NSEdge-layout-preview/main-window.png
        run: |
          $exe = (Resolve-Path artifacts/package/NSEdge/NSEdge.exe).Path
          $p = Start-Process -FilePath $exe -ArgumentList '--smoke-test' -PassThru
          if (-not $p.WaitForExit(20000)) {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            throw 'WPF startup timed out'
          }
          $log = Join-Path $env:LOCALAPPDATA 'NSEdge/NSEdge.log'
          if (Test-Path $log) { Get-Content $log -Tail 70 }
          if ($p.ExitCode -ne 0) { throw "WPF smoke test failed: $($p.ExitCode)" }

      - name: Separate symbols
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/symbols | Out-Null
          Get-ChildItem artifacts/package/NSEdge -Filter *.pdb |
            Move-Item -Destination artifacts/symbols
          if (-not (Test-Path artifacts/package/NSEdge/NSEdge.exe)) {
            throw 'NSEdge.exe missing'
          }

      - name: Package and test ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force artifacts/download | Out-Null
          $filename = "NSEdge-v$env:NSEDGE_VERSION-win-x64.zip"
          $zip = Join-Path artifacts/download $filename
          Compress-Archive -LiteralPath artifacts/package/NSEdge -DestinationPath $zip -CompressionLevel Optimal

          Add-Type -AssemblyName System.IO.Compression
          $archive = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $zip).Path)
          try {
            $entries = @($archive.Entries | Where-Object { $_.FullName -notmatch '/$' })
            if (-not ($entries | Where-Object { $_.FullName -eq 'NSEdge/NSEdge.exe' })) {
              throw 'NSEdge/NSEdge.exe missing from ZIP'
            }
            if ($entries | Where-Object { $_.FullName -notlike 'NSEdge/*' }) {
              throw 'Incorrect ZIP root'
            }
            if ($entries | Where-Object { $_.FullName -match '\.pdb$|NSEdge-win-x64' }) {
              throw 'Unexpected file in application ZIP'
            }
            if ($entries.Count -lt 1) { throw 'Empty ZIP' }
          }
          finally { $archive.Dispose() }

          New-Item -ItemType Directory -Force artifacts/unpacked | Out-Null
          [System.IO.Compression.ZipFile]::ExtractToDirectory(
            (Resolve-Path $zip).Path, (Resolve-Path artifacts/unpacked).Path)
          $exe = (Resolve-Path artifacts/unpacked/NSEdge/NSEdge.exe).Path
          $version = (Get-Item $exe).VersionInfo.ProductVersion
          if ($version -notlike "$env:NSEDGE_VERSION*") {
            throw "Executable version mismatch: $version"
          }
          $p = Start-Process -FilePath $exe -ArgumentList '--smoke-test' -PassThru
          if (-not $p.WaitForExit(20000)) {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            throw 'Packaged app startup timed out'
          }
          if ($p.ExitCode -ne 0) { throw "Packaged app failed: $($p.ExitCode)" }
          $hash = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $filename" | Set-Content -Path artifacts/download/SHA256SUMS.txt -Encoding ascii
          Write-Host "$filename $hash"

      # archive:false uploads the versioned ZIP directly, without an extra ZIP wrapper.
      - name: Upload Windows ZIP
        uses: actions/upload-artifact@v7
        with:
          path: artifacts/download/NSEdge-*.zip
          archive: false
          if-no-files-found: error

      - name: Upload SHA256
        uses: actions/upload-artifact@v7
        with:
          path: artifacts/download/SHA256SUMS.txt
          archive: false
          if-no-files-found: error

      - name: Upload symbols
        uses: actions/upload-artifact@v4
        with:
          name: NSEdge-symbols
          path: artifacts/symbols/
          if-no-files-found: warn

      - name: Upload UI preview
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: NSEdge-preview
          path: artifacts/NSEdge-layout-preview/
          if-no-files-found: ignore
