name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build
        run: dotnet build NSEdge.slnx --configuration Release
      - name: Protocol tests
        run: dotnet run --project tests/NSEdge.Tests --configuration Release --no-build
      - name: Publish portable Windows executable
        run: dotnet publish src/NSEdge.App/NSEdge.App.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true --output artifacts/NSEdge-win-x64
      - name: WPF startup smoke test
        shell: pwsh
        run: |
          $exe = (Resolve-Path 'artifacts/NSEdge-win-x64/NSEdge.exe').Path
          $process = Start-Process -FilePath $exe -ArgumentList '--smoke-test' -PassThru
          if (-not $process.WaitForExit(20000)) {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            throw 'WPF startup smoke test timed out'
          }
          $log = Join-Path $env:LOCALAPPDATA 'NSEdge/NSEdge.log'
          if (Test-Path $log) { Get-Content $log -Tail 70 }
          if ($process.ExitCode -ne 0) { throw "WPF startup smoke test failed with exit code $($process.ExitCode)" }
      - name: Separate debugging symbols
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/NSEdge-symbols | Out-Null
          Get-ChildItem artifacts/NSEdge-win-x64 -Filter *.pdb |
            Move-Item -Destination artifacts/NSEdge-symbols
          if (-not (Test-Path artifacts/NSEdge-win-x64/NSEdge.exe)) {
            throw "Published executable missing"
          }
      - uses: actions/upload-artifact@v4
        with:
          name: NSEdge-win-x64
          path: artifacts/NSEdge-win-x64/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: NSEdge-symbols
          path: artifacts/NSEdge-symbols/
          if-no-files-found: warn
