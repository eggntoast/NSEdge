name: Publish prerelease

on:
  push:
    branches: [main]
    paths:
      - 'release-requests/*.request'
  workflow_dispatch:
    inputs:
      version:
        description: Approved version tag (vX.Y.Z)
        required: true
        type: string
      source_sha:
        description: Approved 40-character commit SHA on main
        required: true
        type: string

jobs:
  publish:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.version }}
      SOURCE_SHA: ${{ inputs.source_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
      - name: Read approved request
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $changed = @(git diff-tree --no-commit-id --name-only -r $env:GITHUB_SHA | Where-Object { $_ -match '^release-requests/v[0-9]+\.[0-9]+\.[0-9]+\.request$' })
          if ($changed.Count -ne 1) { throw 'Expected exactly one release request' }
          $data = @{}
          foreach ($line in Get-Content -LiteralPath $changed[0]) {
            if ($line -match '^\s*(#|$)') { continue }
            if ($line -notmatch '^([a-z0-9_]+)=([a-zA-Z0-9.-]+)$') { throw 'Invalid release request' }
            if ($data.ContainsKey($Matches[1])) { throw 'Duplicate release field' }
            $data[$Matches[1]] = $Matches[2]
          }
          $required = @('version', 'source', 'build_run', 'artifact_id', 'sha256')
          if ($data.Count -ne $required.Count) { throw 'Unexpected release fields' }
          foreach ($key in $required) { if (-not $data.ContainsKey($key)) { throw "Missing field: $key" } }
          if ($data.version -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$' -or $changed[0] -ne "release-requests/$($data.version).request") { throw 'Invalid release version' }
          if ($data.source -cnotmatch '^[0-9a-f]{40}$' -or $data.sha256 -cnotmatch '^[0-9a-f]{64}$') { throw 'Invalid digest' }
          foreach ($key in @('build_run','artifact_id')) { if ($data[$key] -notmatch '^[0-9]+$') { throw "Invalid $key" } }
          "RELEASE_TAG=$($data.version)" >> $env:GITHUB_ENV
          "SOURCE_SHA=$($data.source)" >> $env:GITHUB_ENV
          "BUILD_RUN=$($data.build_run)" >> $env:GITHUB_ENV
          "SOURCE_ARTIFACT_ID=$($data.artifact_id)" >> $env:GITHUB_ENV
          "EXPECTED_SHA256=$($data.sha256)" >> $env:GITHUB_ENV
          git checkout --detach $data.source
          if ($LASTEXITCODE -ne 0) { throw 'Source checkout failed' }
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Verify approved source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+$') { throw 'Invalid version' }
          if ($env:SOURCE_SHA -cnotmatch '^[0-9a-fA-F]{40}$') { throw 'Invalid SHA' }
          if ((git rev-parse HEAD).Trim() -ne $env:SOURCE_SHA) { throw 'Wrong source checkout' }
          git fetch origin main --quiet
          git merge-base --is-ancestor $env:SOURCE_SHA origin/main
          if ($LASTEXITCODE -ne 0) { throw 'Commit is not on main' }
          [xml]$proj = Get-Content src/NSEdge.App/NSEdge.App.csproj -Raw
          $version = [string]$proj.Project.PropertyGroup.Version
          if ("v$version" -ne $env:RELEASE_TAG) { throw "Version mismatch: $version" }
          if ((git ls-remote --tags origin "refs/tags/$env:RELEASE_TAG") | Out-String) { throw 'Tag already exists' }
          "APP_VERSION=$version" >> $env:GITHUB_ENV
      - name: Build and test
        shell: pwsh
        run: |
          dotnet build NSEdge.slnx -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Build failed' }
          dotnet run --project tests/NSEdge.Tests -c Release --no-build
          if ($LASTEXITCODE -ne 0) { throw 'Tests failed' }
      - name: Publish application
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          dotnet publish src/NSEdge.App/NSEdge.App.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -o artifacts/NSEdge
          if ($LASTEXITCODE -ne 0) { throw 'Publish failed' }
      - name: Verify and package
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = (Resolve-Path artifacts/NSEdge/NSEdge.exe).Path
          $p = Start-Process $exe -ArgumentList '--smoke-test' -PassThru
          if (-not $p.WaitForExit(20000)) {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            throw 'Smoke test timed out'
          }
          if ($p.ExitCode -ne 0) { throw 'Startup test failed' }
          Get-ChildItem artifacts/NSEdge -Filter '*.pdb' | Remove-Item -Force
          New-Item -ItemType Directory -Force artifacts/release | Out-Null
          $name = "NSEdge-$env:RELEASE_TAG-win-x64.zip"
          $zip = Join-Path artifacts/release $name
          Compress-Archive -LiteralPath artifacts/NSEdge -DestinationPath $zip -CompressionLevel Optimal
          Add-Type -AssemblyName System.IO.Compression
          $archive = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $zip).Path)
          try {
            $entries = @($archive.Entries | Where-Object { $_.FullName -notmatch '/$' })
            if (-not ($entries | Where-Object { $_.FullName -eq 'NSEdge/NSEdge.exe' })) { throw 'Missing EXE in archive' }
            if ($entries | Where-Object { $_.FullName -notlike 'NSEdge/*' -or $_.FullName -match '\.pdb$' }) {
              throw 'Incorrect ZIP contents'
            }
          }
          finally { $archive.Dispose() }
          New-Item -ItemType Directory -Force artifacts/check | Out-Null
          [System.IO.Compression.ZipFile]::ExtractToDirectory((Resolve-Path $zip).Path, (Resolve-Path artifacts/check).Path)
          $packedExe = (Resolve-Path artifacts/check/NSEdge/NSEdge.exe).Path
          if ((Get-Item $packedExe).VersionInfo.ProductVersion -notlike "$env:APP_VERSION*") { throw 'Wrong EXE version' }
          $p = Start-Process $packedExe -ArgumentList '--smoke-test' -PassThru
          if (-not $p.WaitForExit(20000)) {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            throw 'Packaged app startup timed out'
          }
          if ($p.ExitCode -ne 0) { throw 'Packaged app failed' }
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $name" | Set-Content artifacts/release/SHA256SUMS.txt -Encoding ascii
          "ZIP_PATH=$zip" >> $env:GITHUB_ENV
          "ZIP_NAME=$name" >> $env:GITHUB_ENV
      - name: Download approved CI package
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $run = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:BUILD_RUN" | ConvertFrom-Json
          if ($run.name -ne 'Build' -or $run.event -ne 'push' -or $run.conclusion -ne 'success' -or $run.head_sha -ne $env:SOURCE_SHA) {
            throw 'Source CI run is not approved'
          }
          $artifact = gh api "repos/$env:GITHUB_REPOSITORY/actions/artifacts/$env:SOURCE_ARTIFACT_ID" | ConvertFrom-Json
          $name = "NSEdge-$env:RELEASE_TAG-win-x64.zip"
          if ($artifact.workflow_run.id -ne [long]$env:BUILD_RUN -or $artifact.name -ne $name -or $artifact.expired) { throw 'Invalid source artifact' }
          if ($artifact.digest -and $artifact.digest -ne "sha256:$env:EXPECTED_SHA256") { throw 'Unexpected artifact digest' }
          New-Item -ItemType Directory -Force artifacts/release | Out-Null
          $zip = "artifacts/release/$name"
          & curl.exe --fail --silent --show-error --location -H "Authorization: Bearer $env:GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/artifacts/$env:SOURCE_ARTIFACT_ID/zip" --output $zip
          if ($LASTEXITCODE -ne 0) { throw 'Artifact download failed' }
          $hash = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -cne $env:EXPECTED_SHA256) { throw 'Downloaded ZIP checksum mismatch' }
          Add-Type -AssemblyName System.IO.Compression
          $archive = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $zip).Path)
          try {
            $entries = @($archive.Entries | Where-Object { $_.FullName -notmatch '/$' })
            if (-not ($entries | Where-Object { $_.FullName -eq 'NSEdge/NSEdge.exe' })) { throw 'Missing executable' }
            if ($entries | Where-Object { $_.FullName -notlike 'NSEdge/*' -or $_.FullName -match '\.pdb$' }) { throw 'Unexpected ZIP files' }
          }
          finally { $archive.Dispose() }
          New-Item -ItemType Directory -Force artifacts/check | Out-Null
          [System.IO.Compression.ZipFile]::ExtractToDirectory((Resolve-Path $zip).Path, (Resolve-Path artifacts/check).Path)
          $exe = (Resolve-Path artifacts/check/NSEdge/NSEdge.exe).Path
          if ((Get-Item $exe).VersionInfo.ProductVersion -notlike "$env:APP_VERSION*") { throw 'Wrong EXE version' }
          $p = Start-Process $exe -ArgumentList '--smoke-test' -PassThru
          if (-not $p.WaitForExit(20000)) {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            throw 'Packaged EXE startup timed out'
          }
          if ($p.ExitCode -ne 0) { throw 'Packaged EXE failed' }
          "$hash  $name" | Set-Content artifacts/release/SHA256SUMS.txt -Encoding ascii
          "ZIP_PATH=$zip" >> $env:GITHUB_ENV
          "ZIP_NAME=$name" >> $env:GITHUB_ENV
      - name: Create prerelease
        shell: pwsh
        run: |
          gh release create $env:RELEASE_TAG $env:ZIP_PATH artifacts/release/SHA256SUMS.txt -R $env:GITHUB_REPOSITORY --target $env:SOURCE_SHA --prerelease --title "NSEdge $env:RELEASE_TAG" --notes "Windows 11 x64 prerelease. Bluetooth profile-name caching, Fn + Square and battery readings need physical validation. The executable is unsigned."
          if ($LASTEXITCODE -ne 0) { throw 'Release creation failed' }
      - name: Verify release downloads
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/release-check | Out-Null
          gh release download $env:RELEASE_TAG -R $env:GITHUB_REPOSITORY -p $env:ZIP_NAME -p SHA256SUMS.txt -D artifacts/release-check
          if ($LASTEXITCODE -ne 0) { throw 'Release download failed' }
          $before = (Get-FileHash $env:ZIP_PATH -Algorithm SHA256).Hash
          $after = (Get-FileHash (Join-Path artifacts/release-check $env:ZIP_NAME) -Algorithm SHA256).Hash
          if ($before -ne $after) { throw 'Published ZIP hash mismatch' }
          $checksums = Get-Content artifacts/release-check/SHA256SUMS.txt -Raw
          if (-not $checksums.Contains($before.ToLowerInvariant())) { throw 'Published checksum mismatch' }
