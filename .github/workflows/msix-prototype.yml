name: MSIX prototype

on:
  pull_request:
    paths:
      - 'scripts/package-msix-prototype.ps1'
      - '.github/workflows/msix-prototype.yml'
      - 'src/NSEdge.App/NSEdge.App.csproj'
  workflow_dispatch:

jobs:
  package:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Publish
        run: dotnet publish src/NSEdge.App/NSEdge.App.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -o artifacts/msix/publish
      - name: Build unsigned prototype
        shell: pwsh
        run: ./scripts/package-msix-prototype.ps1 -PublishPath artifacts/msix/publish -OutputDirectory artifacts/msix/prototype
      - name: Upload prototype
        uses: actions/upload-artifact@v7
        with:
          path: artifacts/msix/prototype/*.msix
          archive: false
          if-no-files-found: error
